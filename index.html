<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="Turn videos into clean scripts directly in your browser." />
  <title>ScriptDrop — Video to Script</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f5f5;background:#090909;font-synthesis:none;--yellow:#ffd51f;--panel:#111;--line:#292929;--muted:#909090;--text:#f7f7f7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:var(--text)}button,select,textarea{font:inherit}
    .shell{width:min(820px,calc(100% - 32px));margin:0 auto;padding:52px 0 32px}.hero{padding:8px 4px 28px}
    .brand-row{display:flex;align-items:center;gap:10px}.brand-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--yellow);color:#0a0a0a;font-weight:950}.brand-name{font-weight:850;letter-spacing:-.03em}.pill{margin-left:auto;border:1px solid #313131;color:#bdbdbd;font-size:11px;font-weight:800;letter-spacing:.08em;padding:7px 9px;border-radius:999px}
    h1{font-size:clamp(44px,8vw,78px);line-height:.95;letter-spacing:-.065em;margin:38px 0 18px;font-weight:900}h1 span{color:var(--yellow)}.subtitle{margin:0;max-width:590px;color:#a0a0a0;line-height:1.6;font-size:16px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 18px 60px rgba(0,0,0,.24)}
    .drop-zone{min-height:218px;border:1px dashed #3b3b3b;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:pointer;transition:.16s ease;background:#0d0d0d}.drop-zone:hover,.drop-zone.drag{border-color:var(--yellow);background:#121107}
    .upload-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--yellow);color:#090909;font-size:25px;font-weight:900;margin-bottom:16px}.drop-title{font-size:18px;font-weight:800}.drop-sub{color:var(--muted);margin-top:7px;font-size:13px;line-height:1.5}
    .file-card{display:flex;align-items:center;gap:13px;padding:13px;background:#0d0d0d;border:1px solid #272727;border-radius:14px}.file-icon{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;background:#1e1e1e;color:var(--yellow);font-size:14px}.file-meta{min-width:0;flex:1}.file-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-info{margin-top:4px;color:var(--muted);font-size:12px}.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:#b1b1b1;font-size:25px;cursor:pointer}.icon-btn:hover{background:#1c1c1c;color:#fff}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.control-group{display:flex;flex-direction:column;gap:8px}.control-label{font-size:12px;font-weight:800;letter-spacing:.04em;color:#a3a3a3;text-transform:uppercase}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#0b0b0b;border:1px solid #282828;padding:4px;border-radius:11px}.seg{border:0;background:transparent;color:#9c9c9c;border-radius:8px;padding:11px 12px;cursor:pointer;font-weight:750}.seg.active{background:#252525;color:#fff}
    select{width:100%;min-height:45px;border-radius:11px;border:1px solid #282828;background:#0b0b0b;color:#fff;padding:0 12px;outline:none}.mode-note{margin:13px 2px 0;color:#8f8f8f;font-size:12px;line-height:1.55}.mode-note b{color:#cfcfcf}
    .primary-btn{margin-top:18px;width:100%;border:0;border-radius:13px;min-height:54px;background:var(--yellow);color:#080808;font-weight:900;cursor:pointer;font-size:15px}.primary-btn:disabled{opacity:.35;cursor:not-allowed}
    .progress-wrap{margin-top:16px}.progress-line{height:7px;border-radius:99px;overflow:hidden;background:#252525}.progress-bar{width:0;height:100%;background:var(--yellow);transition:width .2s ease}.progress-copy{display:flex;justify-content:space-between;gap:16px;color:#9b9b9b;font-size:12px;margin-top:8px}
    .error-box{margin-top:14px;border:1px solid #673131;background:#201010;color:#ffb8b8;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.5}
    .result-panel{padding:18px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}.eyebrow{color:var(--yellow);font-weight:900;letter-spacing:.11em;font-size:11px}.result-stats{color:var(--muted);font-size:12px;margin-top:4px}.result-actions{display:flex;gap:8px}.secondary-btn{border:1px solid #303030;background:#191919;color:#efefef;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:750;cursor:pointer}
    textarea{width:100%;min-height:330px;resize:vertical;border:1px solid #272727;border-radius:14px;outline:none;background:#0b0b0b;color:#f2f2f2;padding:18px;line-height:1.7;font-size:15px}footer{display:flex;justify-content:space-between;gap:20px;padding:18px 4px 4px;color:#656565;font-size:11px;line-height:1.5}.hidden{display:none!important}
    @media(max-width:640px){.shell{width:min(100% - 20px,820px);padding-top:28px}.panel{padding:14px;border-radius:17px}.controls{grid-template-columns:1fr}.result-head{align-items:flex-start;flex-direction:column}.result-actions{width:100%}.secondary-btn{flex:1}footer{flex-direction:column;gap:4px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div class="brand-row"><div class="brand-mark">S</div><div class="brand-name">ScriptDrop</div><span class="pill">FREE • PRIVATE</span></div>
    <h1>Drop a video.<br><span>Get the script.</span></h1>
    <p class="subtitle">No captions. No timestamps. No API bill. Your file stays in your browser.</p>
  </header>

  <section class="panel">
    <label id="dropZone" class="drop-zone" for="fileInput" tabindex="0" role="button">
      <input id="fileInput" type="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mp3,.wav,.m4a,.aac" hidden>
      <div class="upload-icon">↑</div><div class="drop-title">Drop video here</div>
      <div class="drop-sub">or click to choose MP4, MOV, M4V, WebM, MP3, WAV, M4A</div>
    </label>

    <div id="fileCard" class="file-card hidden">
      <div class="file-icon">▶</div><div class="file-meta"><div id="fileName" class="file-name"></div><div id="fileInfo" class="file-info"></div></div>
      <button id="removeFile" class="icon-btn" type="button">×</button>
    </div>

    <div class="controls">
      <div class="control-group"><div class="control-label">Output</div><div class="segmented"><button class="seg active" data-mode="exact" type="button">Exact</button><button class="seg" data-mode="clean" type="button">Clean</button></div></div>
      <label class="control-group"><span class="control-label">Language</span><select id="languageSelect"><option value="auto">Auto detect</option><option value="english">English</option><option value="arabic">Arabic</option><option value="urdu">Urdu</option><option value="korean">Korean</option><option value="hindi">Hindi</option><option value="spanish">Spanish</option><option value="french">French</option></select></label>
    </div>
    <div class="mode-note" id="modeNote"><b>Exact:</b> keeps what was said, only fixing spacing.</div>
    <button id="transcribeBtn" class="primary-btn" type="button" disabled><span id="buttonLabel">Transcribe video</span></button>

    <div id="progressWrap" class="progress-wrap hidden"><div class="progress-line"><div id="progressBar" class="progress-bar"></div></div><div class="progress-copy"><span id="statusText">Preparing…</span><span id="progressPct"></span></div></div>
    <div id="errorBox" class="error-box hidden"></div>
  </section>

  <section id="resultPanel" class="panel result-panel hidden">
    <div class="result-head"><div><div class="eyebrow">SCRIPT</div><div id="resultStats" class="result-stats"></div></div><div class="result-actions"><button id="copyBtn" class="secondary-btn" type="button">Copy</button><button id="downloadBtn" class="secondary-btn" type="button">Save .txt</button></div></div>
    <textarea id="resultText" spellcheck="true"></textarea>
  </section>
  <footer><span>Runs locally with Whisper in your browser.</span><span>First use downloads the speech model once.</span></footer>
</main>

<script type="module">
const $=id=>document.getElementById(id);
const fileInput=$('fileInput'),dropZone=$('dropZone'),fileCard=$('fileCard'),fileName=$('fileName'),fileInfo=$('fileInfo'),removeFile=$('removeFile'),transcribeBtn=$('transcribeBtn'),buttonLabel=$('buttonLabel'),languageSelect=$('languageSelect'),modeNote=$('modeNote'),progressWrap=$('progressWrap'),progressBar=$('progressBar'),statusText=$('statusText'),progressPct=$('progressPct'),resultPanel=$('resultPanel'),resultText=$('resultText'),resultStats=$('resultStats'),copyBtn=$('copyBtn'),downloadBtn=$('downloadBtn'),errorBox=$('errorBox');
let selectedFile=null,mode='exact',ffmpeg=null,worker=null,working=false;

const formatBytes=b=>{if(!b)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),u.length-1);return`${(b/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`};
function setProgress(t,v=null){progressWrap.classList.remove('hidden');statusText.textContent=t;if(v==null){progressPct.textContent='';progressBar.style.width='12%'}else{v=Math.max(0,Math.min(100,v));progressBar.style.width=`${v}%`;progressPct.textContent=`${Math.round(v)}%`}}
function showError(m){errorBox.textContent=m;errorBox.classList.remove('hidden')}function clearError(){errorBox.classList.add('hidden');errorBox.textContent=''}
function chooseFile(f){clearError();if(!f)return;const ok=f.type.startsWith('video/')||f.type.startsWith('audio/')||/\.(mp4|mov|m4v|webm|mp3|wav|m4a|aac)$/i.test(f.name);if(!ok)return showError('Please choose a video or audio file.');if(f.size>1.5*1024*1024*1024)return showError('This file is too large for browser processing. Keep it under 1.5 GB.');selectedFile=f;dropZone.classList.add('hidden');fileCard.classList.remove('hidden');fileName.textContent=f.name;fileInfo.textContent=`${formatBytes(f.size)} • processed on this device`;transcribeBtn.disabled=false;resultPanel.classList.add('hidden')}
fileInput.addEventListener('change',e=>chooseFile(e.target.files?.[0]));dropZone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')fileInput.click()});['dragenter','dragover'].forEach(t=>dropZone.addEventListener(t,e=>{e.preventDefault();dropZone.classList.add('drag')}));['dragleave','drop'].forEach(t=>dropZone.addEventListener(t,e=>{e.preventDefault();dropZone.classList.remove('drag')}));dropZone.addEventListener('drop',e=>chooseFile(e.dataTransfer?.files?.[0]));
removeFile.addEventListener('click',()=>{if(working)return;selectedFile=null;fileInput.value='';fileCard.classList.add('hidden');dropZone.classList.remove('hidden');transcribeBtn.disabled=true;resultPanel.classList.add('hidden');progressWrap.classList.add('hidden');clearError()});
document.querySelectorAll('.seg').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.seg').forEach(x=>x.classList.remove('active'));btn.classList.add('active');mode=btn.dataset.mode;modeNote.innerHTML=mode==='exact'?'<b>Exact:</b> keeps what was said, only fixing spacing.':'<b>Clean:</b> removes common filler words and repeated words while keeping the meaning.'}));

async function loadFFmpeg(){
  if(ffmpeg)return ffmpeg;
  setProgress('Loading audio engine…',4);
  let pkg,util;
  try{
    pkg=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
    util=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
  }catch(e){
    pkg=await import('https://esm.sh/@ffmpeg/ffmpeg@0.12.10?bundle');
    util=await import('https://esm.sh/@ffmpeg/util@0.12.1?bundle');
  }
  const {FFmpeg}=pkg,{toBlobURL}=util,instance=new FFmpeg();
  instance.on('progress',({progress})=>{if(Number.isFinite(progress))setProgress('Extracting speech audio…',8+Math.max(0,Math.min(1,progress))*24)});
  const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
  await instance.load({coreURL:await toBlobURL(`${base}/ffmpeg-core.js`,'text/javascript'),wasmURL:await toBlobURL(`${base}/ffmpeg-core.wasm`,'application/wasm')});
  instance.__fetchFile=util.fetchFile;ffmpeg=instance;return ffmpeg
}
function wavToFloat32(bytes){
  const u8=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),v=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),r4=i=>String.fromCharCode(u8[i],u8[i+1],u8[i+2],u8[i+3]);
  if(r4(0)!=='RIFF'||r4(8)!=='WAVE')throw new Error('Could not read extracted audio.');
  let o=12,ch=1,bits=16,fmt=1,data=-1,size=0;
  while(o+8<=u8.length){const id=r4(o),s=v.getUint32(o+4,true),start=o+8;if(id==='fmt '){fmt=v.getUint16(start,true);ch=v.getUint16(start+2,true);bits=v.getUint16(start+14,true)}else if(id==='data'){data=start;size=s;break}o=start+s+(s%2)}
  if(data<0||fmt!==1||bits!==16)throw new Error('Unsupported extracted WAV format.');
  const frames=Math.floor(size/(ch*2)),out=new Float32Array(frames);let p=data;
  for(let i=0;i<frames;i++){let sum=0;for(let c=0;c<ch;c++){sum+=v.getInt16(p,true)/32768;p+=2}out[i]=sum/ch}return out
}
async function extractAudio(file){
  const engine=await loadFFmpeg();setProgress('Extracting speech audio…',9);
  const ext=(file.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'').slice(0,8)||'mp4',input=`input.${ext}`,output='speech.wav';
  await engine.writeFile(input,await engine.__fetchFile(file));
  const code=await engine.exec(['-i',input,'-vn','-ac','1','-ar','16000','-c:a','pcm_s16le',output]);
  if(code!==0)throw new Error('I could not extract audio from this file. Try MP4, MOV, M4A, MP3 or WAV.');
  const bytes=await engine.readFile(output);try{await engine.deleteFile(input);await engine.deleteFile(output)}catch(_){}
  setProgress('Audio ready. Starting transcription…',35);return wavToFloat32(bytes)
}
function getWorker(){if(worker)return worker;worker=new Worker('./worker.js',{type:'module'});return worker}
function transcribeAudio(audio){return new Promise((resolve,reject)=>{const w=getWorker();const onMessage=e=>{const m=e.data||{};if(m.type==='status'){if(m.stage==='model'){const p=typeof m.progress==='number'?35+m.progress*.35:40;setProgress(m.text||'Loading Whisper model…',p)}else setProgress(m.text||'Transcribing speech…',72)}if(m.type==='done'){cleanup();resolve(m.text||'')}if(m.type==='error'){cleanup();reject(new Error(m.message||'Transcription failed.'))}};const onError=e=>{cleanup();reject(new Error(e.message||'Transcription worker failed.'))};const cleanup=()=>{w.removeEventListener('message',onMessage);w.removeEventListener('error',onError)};w.addEventListener('message',onMessage);w.addEventListener('error',onError);w.postMessage({type:'transcribe',audio,mode,language:languageSelect.value},[audio.buffer])})}

transcribeBtn.addEventListener('click',async()=>{if(!selectedFile||working)return;working=true;clearError();resultPanel.classList.add('hidden');transcribeBtn.disabled=true;buttonLabel.textContent='Working…';try{const audio=await extractAudio(selectedFile),text=await transcribeAudio(audio);setProgress('Done',100);resultText.value=text||'(No speech detected)';const words=text.trim()?text.trim().split(/\s+/).length:0;resultStats.textContent=`${words.toLocaleString()} words • ${mode==='clean'?'clean':'exact'} mode`;resultPanel.classList.remove('hidden');resultPanel.scrollIntoView({behavior:'smooth',block:'start'})}catch(error){console.error(error);showError(`${error.message||error} If this browser blocks the local AI engine, try current Chrome or Edge.`);progressWrap.classList.add('hidden')}finally{working=false;transcribeBtn.disabled=!selectedFile;buttonLabel.textContent='Transcribe video'}});
copyBtn.addEventListener('click',async()=>{await navigator.clipboard.writeText(resultText.value);const old=copyBtn.textContent;copyBtn.textContent='Copied';setTimeout(()=>copyBtn.textContent=old,1200)});
downloadBtn.addEventListener('click',()=>{const stem=(selectedFile?.name||'script').replace(/\.[^.]+$/,''),blob=new Blob([resultText.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${stem}-script.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script>
</body>
</html>
